<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バレー ベンチ記録</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-thumb scoresheet. Score card on top, jersey-number grid, then an action x result matrix; tabs fixed at the bottom. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#2A2A31; --muted:#6C6C78; --line:#ECE8EC;
  --accent:#D63B82; --accent-ink:#FFFFFF; --accent-soft:#FFE4F0;
  --good-bg:#D8F5E6; --good:#0F6B45; --bad-bg:#FFE2DA; --bad:#BC2A18; --neu-bg:#F4F2F5;
  --shadow:0 6px 18px rgba(40,30,50,.08);
  --font-ui:"Zen Maru Gothic","Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-num:"Fredoka","Zen Maru Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161B; --surface:#211F27; --ink:#F3F1F5; --muted:#B0ABB8; --line:#35323C;
  --accent:#FF8DBD; --accent-ink:#2A0A18; --accent-soft:#5A2442;
  --good-bg:#17402F; --good:#8FE8B8; --bad-bg:#4C241E; --bad:#FF9F8E; --neu-bg:#2B2931; --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161B; --surface:#211F27; --ink:#F3F1F5; --muted:#B0ABB8; --line:#35323C;
  --accent:#FF8DBD; --accent-ink:#2A0A18; --accent-soft:#5A2442;
  --good-bg:#17402F; --good:#8FE8B8; --bad-bg:#4C241E; --bad:#FF9F8E; --neu-bg:#2B2931; --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}


:root[data-skin="violet"]{--accent:#7B5BE0;--accent-soft:#EDE6FF}
:root[data-skin="mint"]{--accent:#0C8C75;--accent-soft:#D3F4EB}
:root[data-skin="sky"]{--accent:#2A74D0;--accent-soft:#DCEBFF}
@media (prefers-color-scheme:dark){
  :root[data-skin="violet"]:not([data-theme="light"]){--accent:#B79CFF;--accent-soft:#3B2A66;--accent-ink:#1A1226}
  :root[data-skin="mint"]:not([data-theme="light"]){--accent:#6EE0C6;--accent-soft:#17463C;--accent-ink:#082A22}
  :root[data-skin="sky"]:not([data-theme="light"]){--accent:#8DBBFF;--accent-soft:#1D3558;--accent-ink:#0A1A33}}
:root[data-theme="dark"][data-skin="violet"]{--accent:#B79CFF;--accent-soft:#3B2A66;--accent-ink:#1A1226}
:root[data-theme="dark"][data-skin="mint"]{--accent:#6EE0C6;--accent-soft:#17463C;--accent-ink:#082A22}
:root[data-theme="dark"][data-skin="sky"]{--accent:#8DBBFF;--accent-soft:#1D3558;--accent-ink:#0A1A33}

html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 100px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select{font:inherit;color:inherit}
button{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0 10px}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;width:100%}
h2{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0}
.brand{display:flex;align-items:center;gap:8px;padding:2px 4px;font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.04em}
.brand small{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.skins{display:flex;gap:8px;flex-wrap:wrap}
.skins button{display:flex;align-items:center;gap:8px;border-radius:99px;min-height:44px}
.skins button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.sw-dot{width:16px;height:16px;border-radius:50%;display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1;min-width:0}
.muted{color:var(--muted);font-size:12px}

/* score */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sync{min-height:28px;font-size:11px;border-radius:99px;padding:0 10px;color:var(--muted)}
.sync.err{color:var(--bad);border-color:var(--bad)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.board b{font:700 64px/1 var(--font-num);font-variant-numeric:tabular-nums}
.board .us b{color:var(--accent)}
.stepper{display:flex;flex-direction:column;align-items:center;gap:2px}
.stepper .n{font:700 22px/1 var(--font-num);letter-spacing:.04em}
.stepper button{min-height:36px;min-width:44px;padding:0}
.setrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.schip{font:600 13px/1 var(--font-num);padding:5px 9px;border-radius:99px;background:var(--neu-bg);color:var(--muted);font-variant-numeric:tabular-nums}
.schip.on{background:var(--accent-soft);color:var(--accent)}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.manual button{font-size:13px}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pbtn{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:54px;padding:2px 4px;line-height:1.15}
.pbtn .no{font:700 24px/1 var(--font-num)}
.pbtn .nm{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn.on .nm{color:var(--accent-ink)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}button:active:not(:disabled){transform:none}}

/* matrix */
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.mhead .who{font-weight:700}
.mrow{display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.mrow:last-child{margin-bottom:0}
.alabel{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;line-height:1.25}
.rbs{display:grid;gap:6px;grid-template-columns:repeat(var(--cols),1fr)}
.rb{font-size:12px;padding:0 1px;min-height:46px;line-height:1.2}
.rb.g{background:var(--good-bg);color:var(--good);border-color:transparent;font-weight:700}
.rb.b{background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:700}
.rb.n{background:var(--neu-bg);border-color:transparent}
.nop .rb{opacity:.78}

/* log */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .t{flex:1;min-width:0}
.log button{min-height:36px;min-width:44px;padding:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px}
.tag.g{background:var(--good-bg);color:var(--good)}
.tag.b{background:var(--bad-bg);color:var(--bad)}

/* quick sheet */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--neu-bg);padding:4px;border-radius:99px}
.seg button{border:0;background:none;border-radius:99px;font-weight:700;color:var(--muted);min-height:40px;font-size:13px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.qgrid{display:grid;gap:6px;align-items:stretch}
.qgh{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.qn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-width:0}
.qn b{font:700 24px/1 var(--font-num)}
.qn small{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{min-height:56px;padding:0;font-size:14px;font-weight:700;border-radius:12px;border:0;line-height:1.15}
.qb.g{background:var(--good-bg);color:var(--good)}
.qb.b{background:var(--bad-bg);color:var(--bad)}
.qb.n{background:var(--neu-bg);color:var(--ink)}
.qb.hit{animation:hit .4s}
@keyframes hit{0%{transform:scale(.88);filter:brightness(.8)}100%{transform:none;filter:none}}
.both{gap:4px}
.both .qb{font-size:12px;min-height:52px;letter-spacing:-.02em}
.card.mini{padding:10px}
.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.ms{display:flex;align-items:baseline;justify-content:center;gap:6px}
.ms span{font-size:12px;font-weight:700;color:var(--muted)}
.ms b{font:700 40px/1 var(--font-num)}
.ms.us b{color:var(--accent)}
.mset{display:flex;align-items:center;gap:2px;font:700 18px/1 var(--font-num)}
.mset button{min-height:36px;min-width:36px;padding:0;font-size:16px}
.card.mini .manual{margin-top:8px}
.card.mini .manual button{min-height:40px}
.qlast{display:flex;align-items:center;gap:8px;font-size:13px}
.qlast .t{flex:1;min-width:0}
.qlast button{min-height:36px}
/* quick layout */
.qlayout{display:flex;flex-direction:column;gap:12px}
.qA{order:1}.qB{order:2}.qD{order:3}.qC{order:4}.qE{order:5}
.qE{display:flex;flex-direction:column;gap:10px}
@media (orientation:landscape) and (max-height:560px){
  body{padding-block:8px 60px}
  #app{max-width:920px}
  .qlayout{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-areas:"A C" "D C" "B C" "E C";grid-template-rows:auto auto auto 1fr;gap:8px 12px;align-items:start}
  .qA{grid-area:A}.qB{grid-area:B}.qC{grid-area:C}.qD{grid-area:D}.qE{grid-area:E}
  .qlog{display:none}
  .qD.card{padding:6px 8px}
  .qD .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qD .helpb{display:none}
  .qD button{min-height:34px}
  .card.mini .mb{grid-template-columns:1fr 1fr}
  .card.mini .mset{grid-column:1/-1;order:3;justify-content:center}
  .card.mini .manual{grid-template-columns:1fr}
  .ms{flex-direction:column;align-items:center;gap:0}
  .ms b{font-size:32px}
  .qC.card{padding:8px}
  .qgrid{gap:4px}
  .qb,.both .qb{min-height:36px}
  .qn b{font-size:20px}
  #tabbar{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom,0px))}
  #tabbar button{min-height:38px}
}
textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:8px 10px;font:inherit;color:inherit;margin-top:8px}
/* summary (fits one phone screen, no horizontal scroll) */
.shot{padding:10px 8px}
.shot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 4px}
.shot-h b{font-size:15px}
.shot-h .muted{font-size:11px}
.sumh{font-size:12px;font-weight:700;color:var(--accent);padding:8px 4px 3px}
table.fit{table-layout:fixed;width:100%;font-size:12px}
table.fit th,table.fit td{padding:3px 1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip}
table.fit th{font-size:10px;font-weight:700}
table.fit th:first-child,table.fit td:first-child{width:21%;text-align:left;padding-left:4px;position:static;text-overflow:ellipsis}
table.fit td{padding-top:4px;padding-bottom:4px}
.ver{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.qgrid.dense .qb{min-height:44px}
.qgrid.dense{gap:5px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,15,.82);overflow:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{max-width:560px;margin:0 auto}
.ov img{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
/* tabs */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tabbar button{border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);min-height:48px}
#tabbar button{border-radius:18px}
#tabbar button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}

/* stats */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:38px;font-size:13px;border-radius:99px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:700;background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
td.hi{font-weight:700;color:var(--accent)}
tr.total td{font-weight:700;background:var(--neu-bg)}
tr.total td:first-child{background:var(--neu-bg)}
tbody tr:last-child td{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(0,9em) 1fr 3.6em;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:12px;background:var(--neu-bg);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.bar.g .fl{background:var(--good)}
.bar.b .fl{background:var(--bad)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.hint{background:var(--accent-soft);border-color:transparent}
.helpb{min-height:32px;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;color:var(--accent);border-color:var(--accent)}
h2 .helpb{min-height:28px;min-width:28px;padding:0;margin-left:6px;vertical-align:middle}
.row{flex-wrap:nowrap}
.top{flex-wrap:wrap}
.top .row{margin-left:auto}
.helpb,.sync{white-space:nowrap}
.help .steps{margin:8px 0 0;padding-left:1.4em}
.help .legend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;margin-bottom:10px}
.hb{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.hb.g{background:var(--good-bg);color:var(--good)}
.hb.b{background:var(--bad-bg);color:var(--bad)}
.hb.n{background:var(--neu-bg)}
.hrow{border-top:1px solid var(--line);padding:8px 0}
.hact{font-weight:700;font-size:13px;margin-bottom:4px}
.hrow dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;align-items:center}
.hrow dt{margin:0}.hrow dd{margin:0;font-size:12.5px;color:var(--muted)}

/* match / roster */
.mcard{display:flex;flex-direction:column;gap:8px}
.mcard.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.two{display:grid;grid-template-columns:9.5em 1fr;gap:8px}
.prow{display:grid;grid-template-columns:4em 1fr auto;gap:8px;margin-bottom:8px}
.prow input:first-child{text-align:center;font-weight:700}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-bad{color:var(--bad)}
label.sw{display:flex;gap:10px;align-items:flex-start}
label.sw input{width:22px;min-height:22px;margin-top:2px;flex:none}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:700;font-size:13px;color:var(--muted)}
details p{margin:4px 0}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="tabbar" aria-label="メニュー">
  <button data-do="tab" data-v="rec">記録</button>
  <button data-do="tab" data-v="stat">集計</button>
  <button data-do="tab" data-v="match">試合</button>
  <button data-do="tab" data-v="team">選手</button>
</nav>

<script>
// ==PURE-START==
var ACTIONS=[
  {k:'at',n:'アタック',res:[{k:'k',n:'決定',pt:1},{k:'c',n:'継続'},{k:'b',n:'被ブロック',h:'被<br>ブロック',pt:-1},{k:'e',n:'ミス',pt:-1}]},
  {k:'sv',n:'サーブ',res:[{k:'a',n:'エース',pt:1},{k:'g',n:'効果的'},{k:'n',n:'普通'},{k:'e',n:'ミス',pt:-1}]},
  {k:'rc',n:'サーブ<wbr>レシーブ',pl:'サーブレシーブ',res:[{k:'a',n:'A'},{k:'b',n:'B'},{k:'c',n:'C'},{k:'d',n:'D失点',pt:-1}]},
  {k:'dg',n:'ディグ',res:[{k:'g',n:'成功'},{k:'p',n:'乱れ'},{k:'e',n:'失敗',pt:-1}]},
  {k:'ts',n:'トス',res:[{k:'g',n:'良'},{k:'m',n:'トスミス'},{k:'x',n:'トスミス失点',pt:-1}]},
  {k:'bl',n:'ブロック',res:[{k:'k',n:'得点',pt:1},{k:'t',n:'タッチ'},{k:'e',n:'ミス',pt:-1}]},
  {k:'ot',n:'反則',res:[{k:'n',n:'ネット',pt:-1},{k:'d',n:'ドリブル等',pt:-1},{k:'o',n:'その他',pt:-1}]}
];
var ACT={};
ACTIONS.forEach(function(a){a.pl=a.pl||a.n;ACT[a.k]=a;a.res.forEach(function(r){r.pt=r.pt||0;});});
function ptOf(a,r){
  if(a==='pt')return r==='u'?1:-1;
  var x=ACT[a];if(!x)return 0;
  for(var i=0;i<x.res.length;i++)if(x.res[i].k===r)return x.res[i].pt;
  return 0;
}
function resName(a,r){
  if(a==='pt')return r==='u'?'相手ミスで自チーム+1':'相手の得点+1';
  var x=ACT[a];if(!x)return r;
  for(var i=0;i<x.res.length;i++)if(x.res[i].k===r)return x.res[i].n;
  return r;
}
function scoreOf(ev,set){
  var us=0,op=0;
  ev.forEach(function(e){if(e[0]!==set)return;var p=ptOf(e[2],e[3]);if(p>0)us++;else if(p<0)op++;});
  return {us:us,op:op};
}
function setsOf(ev,cur){
  var s={};s[cur]=1;ev.forEach(function(e){s[e[0]]=1;});
  return Object.keys(s).map(Number).sort(function(a,b){return a-b;});
}
function tally(evs){
  var by={};
  evs.forEach(function(e){
    var o=by[e[1]]||(by[e[1]]={});var k=e[2]+'.'+e[3];o[k]=(o[k]||0)+1;
  });
  return by;
}
function sumObj(list){
  var t={};
  list.forEach(function(o){for(var k in o)t[k]=(t[k]||0)+o[k];});
  return t;
}
function ratio(n,d){return d>0?n/d:null;}
function pstat(o){
  function g(a,r){return o[a+'.'+r]||0;}
  function tot(a){var n=0;for(var k in o)if(k.indexOf(a+'.')===0)n+=o[k];return n;}
  var s={};
  s.atN=tot('at');s.atK=g('at','k');s.atC=g('at','c');s.atB=g('at','b');s.atE=g('at','e');
  s.atRate=ratio(s.atK,s.atN);s.atEff=ratio(s.atK-s.atB-s.atE,s.atN);
  s.svN=tot('sv');s.svA=g('sv','a');s.svG=g('sv','g');s.svNo=g('sv','n');s.svE=g('sv','e');
  s.svAceRate=ratio(s.svA,s.svN);s.svErrRate=ratio(s.svE,s.svN);
  s.rcN=tot('rc');s.rcA1=g('rc','a');s.rcB1=g('rc','b');s.rcC1=g('rc','c');s.rcD1=g('rc','d');
  s.rcARate=ratio(s.rcA1,s.rcN);s.rcABRate=ratio(s.rcA1+s.rcB1,s.rcN);
  s.dgN=tot('dg');s.dgG=g('dg','g');s.dgP=g('dg','p');s.dgE=g('dg','e');s.dgRate=ratio(s.dgG,s.dgN);
  s.tsN=tot('ts');s.tsG=g('ts','g');s.tsM=g('ts','m');s.tsX=g('ts','x');s.tsErr=ratio(s.tsM+s.tsX,s.tsN);s.tsMiss=s.tsM+s.tsX;
  s.blK=g('bl','k');s.blT=g('bl','t');s.blE=g('bl','e');
  s.otN=tot('ot');
  return s;
}
function causes(evs){
  var loss={},gain={};
  evs.forEach(function(e){
    var p=ptOf(e[2],e[3]);if(!p)return;
    var key=e[2]+'.'+e[3];var t=p>0?gain:loss;t[key]=(t[key]||0)+1;
  });
  return {loss:loss,gain:gain};
}
function causeLabel(key){
  var i=key.indexOf('.');var a=key.slice(0,i),r=key.slice(i+1);
  if(a==='pt')return r==='u'?'相手のミス(手入力)':'相手の得点(手入力)';
  var x=ACT[a];return (x?x.pl:a)+' '+resName(a,r);
}

function mark(key){
  S.touched=true;lsSave();

  dirty[key]=1;setSync('saving');
  clearTimeout(timer);timer=setTimeout(flush,700);

async function flush(){
  if(flushing){timer=setTimeout(flush,300);return;}
  flushing=true;
  try{
    var keys=Object.keys(dirty);
    for(var i=0;i<keys.length;i++){
      var key=keys[i];
      try{
        if(key==='roster'){
          await col.doc('roster').set({kind:'roster',json:JSON.stringify({roster:S.roster,nextPid:S.nextPid})});
        }else{
          var m=S.matches.find(function(x){return x.id===key;});
          if(m)await col.doc(key).set({kind:'match',id:m.id,date:m.date,opp:m.opp,set:m.set,ev:JSON.stringify(m.ev)});
          else await col.doc(key).delete();
        }
        delete dirty[key];
      }catch(err){setSync('error');return;}
    }
    setSync('saved');
  }finally{flushing=false;}
}
async function connectDb(){
  try{
    if(!(window.claude&&window.claude.use))return;
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=res[0],user=res[1];
    if(!db||!user)return;
    var uid=await user.id();
    if(!uid)return;
    var c=db.collection('data/users/'+uid);
    var snap=await c.get();
    if(snap.empty||S.touched){
      col=c;
      dirty.roster=1;S.matches.forEach(function(m){dirty[m.id]=1;});
      setSync('saving');flush();
      return;
    }
    var roster=null,ms=[];
    snap.docs.forEach(function(d){
      var x=d.data();if(!x)return;
      if(x.kind==='roster'){try{roster=JSON.parse(x.json);}catch(e){}}
      else if(x.kind==='match'){try{ms.push({id:x.id,date:x.date,opp:x.opp||'',set:x.set||1,ev:JSON.parse(x.ev||'[]')});}catch(e){}}
    });
    if(roster){S.roster=roster.roster||[];S.nextPid=roster.nextPid||1;S.sample=false;}
    if(ms.length){
      ms.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
      S.matches=ms;
      if(!S.matches.some(function(m){return m.id===S.curId;}))S.curId=S.matches[S.matches.length-1].id;
    }
    col=c;lsSave();setSync('saved');render();
  }catch(e){/* stay local */}
}

      ((multi||S.matches.length>1)?'<div class="row" style="flex-wrap:wrap">'+
        (multi?'<button class="btn-bad sp" data-do="delset" data-id="'+m.id+'">'+(cfS?'本当に削除':'第'+lt+'セットを削除('+ltN+'件)')+'</button>':'')+
        (S.matches.length>1?'<button class="btn-bad'+(multi?'':' sp')+'" data-do="delmatch" data-id="'+m.id+'">'+(cf?'本当に削除':'試合ごと削除')+'</button>':'')+'</div>':'')+
      '</div>';
  }).join('');
  return '<section class="card"><h2>新しい試合</h2><div class="two" style="margin-top:8px"><input type="date" id="nm-date" value="'+todayStr()+'" aria-label="日付"><input type="text" id="nm-opp" placeholder="相手チーム名" aria-label="相手チーム名"></div>'+
    '<button class="btn-main" data-do="newmatch" style="width:100%;margin-top:8px">試合を追加して記録を始める</button></section>'+list;
}
function vTeam(){
  var rows=activePlayers().map(function(p){
    return '<div class="prow"><input type="text" id="pn-'+p.id+'" data-f="num" data-id="'+p.id+'" value="'+esc(p.num)+'" maxlength="3" aria-label="背番号"><input type="text" id="pm-'+p.id+'" data-f="name" data-id="'+p.id+'" value="'+esc(p.name)+'" placeholder="名前" aria-label="名前"><button class="btn-bad" data-do="delp" data-id="'+p.id+'">外す</button></div>';
  }).join('');
  return '<section class="card"><div class="mhead"><h2>メンバー</h2><span class="muted">'+activePlayers().length+'人</span></div>'+rows+
    '<button data-do="addp" style="width:100%">選手を追加</button>'+
    '<p class="muted">外した選手の過去の記録は集計に残ります。背番号は文字でも入力できます(例: L)。</p></section>'+
    '<section class="card"><label class="sw"><input type="checkbox" id="keep" data-f="keep"'+(S.ui.keep?' checked':'')+'><span><b>記録後も選手を選んだままにする</b><br><span class="muted">同じ選手が続けて触るトスやレシーブを入力するときに便利です。</span></span></label></section>'+
    '<section class="card"><h2>きせかえ</h2><div class="skins" style="margin-top:8px">'+[['sakura','さくら','#D63B82'],['violet','むらさき','#7B5BE0'],['mint','ミント','#0C8C75'],['sky','そら','#2A74D0']].map(function(k){return '<button data-do="skin" data-k="'+k[0]+'" aria-pressed="'+(S.ui.skin===k[0])+'"><span class="sw-dot" style="background:'+k[2]+'"></span>'+k[1]+'</button>';}).join('')+'</div></section>'+
    '<section class="card"><h2>バックアップ</h2><p class="muted" style="margin:6px 0 8px">記録はこの端末のブラウザに保存されています。ブラウザのデータを消すと記録も消えるので、ときどき書き出してください。</p><div class="row" style="flex-wrap:wrap"><button class="sp" data-do="bkcopy">全データをコピー</button><button class="sp" data-do="bksave">ファイルに保存</button></div><textarea id="bktext" rows="3" placeholder="復元するときは、コピーした内容をここに貼り付けます"></textarea><button id="bkmerge" data-do="bkmerge" class="btn-main" style="width:100%;margin-top:8px">追加で取り込む(いまの記録は残す)</button><details style="margin-top:8px"><summary>上級: いまの記録をすべて消して置き換える</summary><p class="muted">貼り付けた内容だけが残り、いまの記録は消えます。通常は上の「追加で取り込む」を使ってください。</p><button id="bkrestore" data-do="bkrestore" class="btn-bad" style="width:100%">いまの記録を消して、貼り付けた内容に置き換える</button></details></section>'+
    '<section class="card"><h2>削除・取り込みの前の状態</h2><p class="muted" style="margin:6px 0 8px">試合やセットの削除、取り込みの直前の状態を、最大5つまで自動で保管しています。押すと、その時点に戻ります。</p>'+
    (undoList().length?undoList().map(function(u,i){return '<div class="row" style="margin-bottom:8px"><span class="sp">'+esc(fmtAt(u.at)+'　'+u.label)+'<br><span class="muted">試合'+((u.data&&u.data.matches)?u.data.matches.length:0)+'件</span></span><button data-do="undorest" data-i="'+i+'">この時点に戻す</button></div>';}).join(''):'<div class="muted">まだありません</div>')+'</section>'+
    '<section class="card"><h2>バージョン</h2><p class="muted" style="margin:6px 0 8px">いまの版: '+APP_VERSION+'。古い画面のままのときは、下のボタンで最新版を読み込みます。記録は消えません。</p><button data-do="reload" style="width:100%">最新版を読み込み直す</button></section>'+
    '<section class="card"><h2>保存について</h2><p class="muted" style="margin:6px 0 0">'+(col?'記録はアカウントに保存され、別の端末で開いても引き継がれます。他の端末で入力した直後は、ページを開き直すと反映されます。':'いまはこの端末のブラウザにだけ保存しています。サインインして開くとアカウントに保存されます。')+'集計タブからCSVも書き出せます。</p></section>';
}
function render(){
  var v={rec:vRec,stat:vStat,match:vMatch,team:vTeam}[S.ui.tab]||vRec;
  var y=window.scrollY;
  $('#app').innerHTML=v()+'<div class="ver">バージョン '+APP_VERSION+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'),function(b){
    if(b.getAttribute('data-v')===S.ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,y);
}

/* ---------- actions ---------- */
function record(a,r){
  var m=cur();
  if(a!=='pt'&&!S.ui.pid){
    toast('先に選手を選んでください');
    var g=$('#pgrid');if(g){g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');}
    return;
  }
  var pid=a==='pt'?0:S.ui.pid;
  var e=[m.set,pid,a,r,Date.now()];
  m.ev.push(e);mark(m.id);buzz();
  toast('✓ '+evText(e));
  if(!S.ui.keep)S.ui.pid=null;
  render();
}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function statCsv(){
  var evs=[];scopeMatches().forEach(function(m){evs=evs.concat(m.ev);});
  var R=statRows(evs),head=['背番号','名前'],keys=[];
  Object.keys(TABS).forEach(function(k){TABS[k].cols.forEach(function(c){head.push(TABS[k].n+'_'+c[0]+(c[2]==='p'?'(%)':''));keys.push(c);});});
  var line=function(a){return a.map(csvEsc).join(',');};
  var val=function(s,c){var v=s[c[1]];return c[2]==='p'?(v==null?'':(v*100).toFixed(1)):v;};
  var out=[line(head)];
  S.roster.forEach(function(p){
    var o=tally(evs)[p.id];if(!o)return;
    var s=pstat(o);out.push(line([p.num,p.name].concat(keys.map(function(c){return val(s,c);}))));
  });
  out.push(line(['','チーム計'].concat(keys.map(function(c){return val(R.total,c);}))));
  return '﻿'+out.join('\r\n')+'\r\n';
}
function eventCsv(){
  var out=['試合日,相手,セット,背番号,名前,プレー,結果,得失点,入力時刻'];
  scopeMatches().forEach(function(m){
    m.ev.forEach(function(e){
      var p=S.roster.find(function(x){return x.id===e[1];});
      var pt=ptOf(e[2],e[3]);
      var d=new Date(e[4]);
      out.push([m.date,m.opp,e[0],p?p.num:'',p?p.name:'',e[2]==='pt'?'手入力':ACT[e[2]].pl,resName(e[2],e[3]),pt>0?'得点':pt<0?'失点':'',isNaN(d)?'':d.toLocaleTimeString('ja-JP')].map(csvEsc).join(','));
    });
  });
  return '﻿'+out.join('\r\n')+'\r\n';
}
async function saveCsv(name,text){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){
      var okA=false;
      try{var blob=new Blob([text],{type:/\.json$/.test(name)?'application/json':'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);okA=true;}catch(e2){}
      toast(okA?'保存を始めました。ダウンロードを確認してください':'保存できませんでした。コピーを使ってください');return;}
    await dl.save({filename:name,data:text});
    toast('保存しました');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('保存できませんでした。「集計をコピー」を試してください');
  }
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-do]');if(!b)return;
  var d=b.getAttribute('data-do'),m=cur();
  switch(d){
    case 'tab':S.ui.tab=b.getAttribute('data-v');S.ui.confirm=null;render();window.scrollTo(0,0);break;
    case 'pick':{var id=+b.getAttribute('data-p');S.ui.pid=S.ui.pid===id?null:id;render();break;}
    case 'rec':record(b.getAttribute('data-a'),b.getAttribute('data-r'));break;
    case 'set':{var n=m.set+(+b.getAttribute('data-d'));if(n>=1&&n<=5){m.set=n;mark(m.id);render();}break;}
    case 'undo':if(m.ev.length){var e=m.ev.pop();mark(m.id);toast('取り消し: '+evText(e));render();}break;
    case 'delev':{var i=+b.getAttribute('data-i');if(m.ev[i]){m.ev.splice(i,1);mark(m.id);render();}break;}
    case 'help':S.ui.help=!S.ui.help;render();if(S.ui.help)window.scrollTo(0,0);break;
    case 'skin':S.ui.skin=b.getAttribute('data-k');applySkin(S.ui.skin);lsSave();render();break;
    case 'mode':S.ui.mode=b.getAttribute('data-k');S.ui.pid=null;lsSave();render();break;
    case 'qsk':S.ui.qsk=b.getAttribute('data-k');lsSave();render();break;
    case 'courtedit':courtPlayers();S.ui.courtEdit=true;render();break;
    case 'courtdone':S.ui.courtEdit=false;lsSave();render();break;
    case 'court':{var cid=+b.getAttribute('data-p'),ix=S.court.indexOf(cid);if(ix>=0)S.court.splice(ix,1);else S.court.push(cid);lsSave();render();break;}
    case 'qrec':{var qp=+b.getAttribute('data-p'),qa=b.getAttribute('data-a'),qr=b.getAttribute('data-r');S.ui.pid=qp;record(qa,qr);S.ui.pid=null;flashBtn(qp,qa,qr);break;}
    case 'sumimg':showSummaryImage();break;
    case 'imgshare':shareSummaryImage();break;
    case 'imgclose':{var ov2=document.getElementById('imgov');if(ov2)ov2.remove();break;}
    case 'reload':reloadFresh();break;
    case 'hidehint':S.ui.hint=false;lsSave();render();break;
    case 'retry':if(col){dirty[m.id]=1;dirty.roster=1;flush();}break;
    case 'stab':S.ui.stab=b.getAttribute('data-k');render();break;
    case 'newmatch':{
      var nm=newMatch($('#nm-date').value||todayStr(),$('#nm-opp').value.trim());
      S.matches.push(nm);S.curId=nm.id;S.ui.tab='rec';S.ui.pid=null;mark(nm.id);render();window.scrollTo(0,0);toast('新しい試合を始めました');break;}
    case 'selmatch':S.curId=b.getAttribute('data-id');S.ui.tab='rec';S.ui.pid=null;S.ui.scope='cur';lsSave();render();window.scrollTo(0,0);break;
    case 'delset':{
      var sid=b.getAttribute('data-id'),sm=S.matches.find(function(x){return x.id===sid;});
      if(!sm)break;
      if(S.ui.confirm!=='s:'+sid){S.ui.confirm='s:'+sid;render();break;}
      var sss=setsOf(sm.ev,sm.set),slt=sss[sss.length-1],before=sm.ev.length;
      saveUndo('セットを削除する前');
      sm.ev=sm.ev.filter(function(e){return e[0]!==slt;});
      if(sm.set>=slt)sm.set=Math.max(1,slt-1);
      S.ui.confirm=null;S.ui.pid=null;mark(sm.id);render();
      toast('第'+slt+'セットを削除しました('+(before-sm.ev.length)+'件)');break;}
    case 'delmatch':{
      var id2=b.getAttribute('data-id');
      if(S.ui.confirm!==id2){S.ui.confirm=id2;render();break;}
      saveUndo('試合を削除する前');
      S.matches=S.matches.filter(function(x){return x.id!==id2;});
      if(S.curId===id2)S.curId=S.matches[S.matches.length-1].id;
      S.ui.confirm=null;mark(id2);if(col){dirty.roster=1;}render();toast('試合を削除しました');break;}
    case 'addp':{
      var nums=activePlayers().map(function(p){return parseInt(p.num,10);}).filter(function(x){return !isNaN(x);});
      var nx=nums.length?Math.max.apply(null,nums)+1:1;
      S.roster.push({id:S.nextPid++,num:String(nx),name:'',arch:false});S.sample=false;mark('roster');render();break;}
    case 'delp':{
      var p=S.roster.find(function(x){return x.id===+b.getAttribute('data-id');});
      if(p){p.arch=true;if(S.ui.pid===p.id)S.ui.pid=null;mark('roster');render();toast('外しました(過去の記録は残ります)');}break;}
    case 'bkcopy':{
      var js=JSON.stringify(snapshot());
      (navigator.clipboard?navigator.clipboard.writeText(js):Promise.reject()).then(function(){toast('コピーしました。メモなどに貼って保管してください');},function(){toast('コピーできませんでした。「ファイルに保存」を試してください');});
      break;}
    case 'bksave':saveCsv('volley_backup.json',JSON.stringify(snapshot()));break;
    case 'undorest':{
      var ul=undoList(),u=ul[+b.getAttribute('data-i')];
      if(!u||!u.data||!Array.isArray(u.data.matches)||!u.data.matches.length){toast('戻せませんでした');break;}
      saveUndo('「戻す」を押す前');
      applyLocal(u.data);S.touched=true;
      if(!S.matches.some(function(x){return x.id===S.curId;}))S.curId=S.matches[S.matches.length-1].id;
      lsSave();
      if(col){dirty.roster=1;S.matches.forEach(function(x){dirty[x.id]=1;});flush();}
      applySkin(S.ui.skin);render();toast('その時点の状態に戻しました');break;}
    case 'bkmerge':{
      var tm=$('#bktext'),t3=tm?tm.value.trim():'';
      if(!t3){toast('先に、取り込む内容を貼り付けてください');break;}
      try{
        var d3=JSON.parse(t3);
        if(!d3||!Array.isArray(d3.matches)||!Array.isArray(d3.roster))throw 0;
        saveUndo('追加で取り込む前');
        var idmap={},addP=0,addM=0,skipM=0;
        d3.roster.forEach(function(ip){
          var ex=S.roster.find(function(x){return x.name===ip.name&&x.num===ip.num;})||S.roster.find(function(x){return ip.name&&x.name===ip.name;});
          if(ex){idmap[ip.id]=ex.id;}
          else{var np={id:S.nextPid++,num:String(ip.num),name:ip.name||'',arch:false};S.roster.push(np);idmap[ip.id]=np.id;addP++;}
        });
        d3.matches.forEach(function(m){
          if(!m||!m.id||!Array.isArray(m.ev))throw 0;
          if(S.matches.some(function(x){return x.id===m.id;})){skipM++;return;}
          var evs=[];
          m.ev.forEach(function(e){
            if(!Array.isArray(e)||e.length<4)return;
            var pid=e[1]===0?0:idmap[e[1]];
            if(pid===undefined)return;
            evs.push([e[0],pid,e[2],e[3],e[4]||0]);
          });
          var nm2={id:m.id,date:m.date||todayStr(),opp:m.opp||'',set:m.set||1,ev:evs};
          S.matches.push(nm2);mark(nm2.id);addM++;
        });
        S.sample=false;S.touched=true;mark('roster');lsSave();render();
        toast(addM?('試合を'+addM+'件、選手を'+addP+'人追加しました'):'追加する試合はありませんでした(すでに取り込み済みです)');
      }catch(e){toast('取り込めませんでした。内容が正しいか確認してください');}
      break;}
    case 'bkrestore':{
      var ta=$('#bktext'),txt2=ta?ta.value.trim():'';
      if(!txt2){toast('先に、コピーした内容を貼り付けてください');break;}
      if(b.getAttribute('data-armed')!=='1'){b.setAttribute('data-armed','1');b.textContent='本当に置き換える(いまの記録は消えます)';break;}
      try{
        var d2=JSON.parse(txt2);
        if(!d2||!Array.isArray(d2.matches)||!d2.matches.length||!Array.isArray(d2.roster))throw 0;
        d2.matches.forEach(function(x){if(!x.id||!Array.isArray(x.ev))throw 0;});
        saveUndo('置き換え復元の前');
        applyLocal(d2);S.touched=true;
        if(!S.matches.some(function(x){return x.id===S.curId;}))S.curId=S.matches[S.matches.length-1].id;
        lsSave();
        if(col){dirty.roster=1;S.matches.forEach(function(x){dirty[x.id]=1;});flush();}
        applySkin(S.ui.skin);render();toast('復元しました');
      }catch(e){b.removeAttribute('data-armed');b.textContent='いまの記録を消して、貼り付けた内容に置き換える';toast('復元できませんでした。内容が正しいか確認してください');}
      break;}
    case 'csvp':saveCsv('volley_stats.csv',statCsv());break;
    case 'csve':saveCsv('volley_plays.csv',eventCsv());break;
    case 'copyp':{
      var txt=statCsv().replace('﻿','').replace(/,/g,'\t');
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('コピーしました。Excelに貼り付けできます');},function(){toast('コピーできませんでした');});
      break;}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target,f=t.getAttribute&&t.getAttribute('data-f');
  if(t.id==='scope'){S.ui.scope=t.value===S.curId?'cur':t.value;render();return;}
  if(!f)return;
  var id=t.getAttribute('data-id');
  if(f==='keep'){S.ui.keep=t.checked;lsSave();return;}
  if(f==='num'||f==='name'){
    var p=S.roster.find(function(x){return x.id===+id;});
    if(p){p[f]=t.value.trim();if(f==='num'&&!p.num){p.num='?';t.value='?';}S.sample=false;mark('roster');}
  }else if(f==='mdate'||f==='mopp'){
    var m=S.matches.find(function(x){return x.id===id;});
    if(m){if(f==='mdate'&&t.value)m.date=t.value;if(f==='mopp')m.opp=t.value.trim();mark(m.id);}
  }
});

/* ---------- boot ---------- */
(function(){
  var d=lsLoad();
  if(d&&d.matches&&d.matches.length)applyLocal(d);else{seedLocal();lsSave();}
  if(!cur())seedLocal();
  S.curId=cur().id;
  applySkin(S.ui.skin);
  var wasNarrow=window.innerWidth<640;
  window.addEventListener('resize',function(){var nw=window.innerWidth<640;if(nw!==wasNarrow){wasNarrow=nw;if(S.ui.tab==='rec')render();}});
  render();
  connectDb();
  checkUpdate();
})();
</script>
